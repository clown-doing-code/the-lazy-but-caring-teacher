name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Also run it manually from the Actions tab.
  workflow_dispatch:

# Allow Pages to create the deployment and mint the OIDC token it verifies.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; cancel superseded ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Catches type and link errors before the site goes live.
      - name: Check types
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
